name: Project 4 EC2 cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Remove only Project 4 resources
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$EC2_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob

          echo "Disk usage before cleanup:"
          docker system df

          mapfile -t containers < <(
            docker ps -aq --filter 'name=project4-smoke-'
          )
          if ((${#containers[@]})); then
            docker container rm -f "${containers[@]}"
          fi

          mapfile -t image_ids < <(docker image ls -aq | sort -u)
          for image_id in "${image_ids[@]}"; do
            entrypoint=$(
              docker image inspect "$image_id" \
                --format '{{json .Config.Entrypoint}}'
            )
            repo_tags=$(
              docker image inspect "$image_id" \
                --format '{{json .RepoTags}}'
            )

            if [[ "$repo_tags" == *project4-dotnet:* ]] ||
               [[ "$entrypoint" == '["dotnet","MultiProjectApp.dll"]' ]]; then
              docker image rm -f "$image_id"
            fi
          done

          rm -f /tmp/project4-*.tar.gz

          for git_dir in "$HOME"/*/.git "$HOME"/*/*/.git; do
            repo_dir=${git_dir%/.git}
            remote_url=$(git -C "$repo_dir" remote get-url origin 2>/dev/null || true)
            case "$remote_url" in
              *github.com:CTRL02/CI_CD-Testing.git|\
              *github.com/CTRL02/CI_CD-Testing.git|\
              *github.com:Daniel-Rafik-Organization/CI_CD-Testing.git|\
              *github.com/Daniel-Rafik-Organization/CI_CD-Testing.git)
                rm -rf -- "$repo_dir"
                ;;
            esac
          done

          if docker image ls --format '{{.Repository}}' |
             grep -Fxq project4-dotnet; then
            echo "Project 4 images remain after cleanup" >&2
            exit 1
          fi

          if compgen -G '/tmp/project4-*.tar.gz' >/dev/null; then
            echo "Project 4 temporary archives remain after cleanup" >&2
            exit 1
          fi

          echo "Disk usage after cleanup:"
          docker system df
          df -h /
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
