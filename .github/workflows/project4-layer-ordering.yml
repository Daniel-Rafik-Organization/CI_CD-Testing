name: Project 4 experiment - Docker layer ordering

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: Dockerfile ordering variant
        required: true
        default: Dockerfile
        type: choice
        options:
          - Dockerfile
          - Dockerfile.bad-order

permissions:
  contents: read

env:
  IMAGE_NAME: project4-dotnet
  DOCKERFILE: ${{ inputs.dockerfile }}

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Start measurement
        run: echo "PIPELINE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore and test without host cache
        run: |
          dotnet nuget locals all --clear
          dotnet restore MultiProjectApp.slnx --configfile NuGet.config
          dotnet test MultiProjectApp.slnx \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=layer-ordering.trx" \
            --results-directory TestResults

      - name: Populate local BuildKit cache
        run: |
          start_ms=$(date +%s%3N)
          docker build \
            --progress plain \
            --file "$DOCKERFILE" \
            --tag "$IMAGE_NAME:warmup-$GITHUB_RUN_ID" \
            . 2>&1 | tee "$RUNNER_TEMP/warmup-build.log"
          end_ms=$(date +%s%3N)
          echo "WARMUP_BUILD_MS=$((end_ms - start_ms))" >> "$GITHUB_ENV"

      - name: Make a source-only change
        run: |
          printf '\n// Layer-ordering experiment run %s\n' "$GITHUB_RUN_ID" \
            >> MultiProjectApp/Program.cs

      - name: Rebuild after source change
        run: |
          log="$RUNNER_TEMP/source-change-build.log"
          start_ms=$(date +%s%3N)
          docker build \
            --progress plain \
            --file "$DOCKERFILE" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            . 2>&1 | tee "$log"
          end_ms=$(date +%s%3N)

          cached_steps=$(grep -c ' CACHED$' "$log" || true)
          restore_reran=false
          if grep -Fq 'Determining projects to restore' "$log"; then
            restore_reran=true
          fi

          image_bytes=$(docker image inspect "$IMAGE_NAME:$GITHUB_SHA" --format '{{.Size}}')
          echo "SOURCE_REBUILD_MS=$((end_ms - start_ms))" >> "$GITHUB_ENV"
          echo "CACHED_STEPS=$cached_steps" >> "$GITHUB_ENV"
          echo "RESTORE_RERAN=$restore_reran" >> "$GITHUB_ENV"
          echo "IMAGE_BYTES=$image_bytes" >> "$GITHUB_ENV"

      - name: Validate rebuilt image
        run: |
          output=$(docker run --rm "$IMAGE_NAME:$GITHUB_SHA")
          printf '%s\n' "$output"
          grep -Fq 'string: The quick brown fox jumps over the lazy dog' <<<"$output"
          grep -Fq 'reversed: god yzal eht revo spmuj xof nworb kciuq ehT' <<<"$output"

      - name: Create image archive
        run: |
          archive="$RUNNER_TEMP/project4-${GITHUB_SHA}.tar.gz"
          start_ms=$(date +%s%3N)
          docker save "$IMAGE_NAME:$GITHUB_SHA" | gzip -1 > "$archive"
          end_ms=$(date +%s%3N)
          echo "IMAGE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "ARCHIVE_MS=$((end_ms - start_ms))" >> "$GITHUB_ENV"
          echo "ARCHIVE_BYTES=$(stat --format='%s' "$archive")" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Transfer and run rebuilt image on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT }}
        run: |
          image="$IMAGE_NAME:$GITHUB_SHA"
          remote_archive="/tmp/project4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          ssh_options=(
            -i ~/.ssh/deploy_key
            -p "$EC2_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=10
          )

          transfer_start_ms=$(date +%s%3N)
          scp \
            -i ~/.ssh/deploy_key \
            -P "$EC2_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$IMAGE_ARCHIVE" \
            "$EC2_USER@$EC2_HOST:$remote_archive"
          transfer_end_ms=$(date +%s%3N)
          echo "TRANSFER_MS=$((transfer_end_ms - transfer_start_ms))" >> "$GITHUB_ENV"

          remote_output=$(
            ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" \
              bash -s -- "$image" "$remote_archive" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          image=$1
          archive=$2
          run_id=$3
          trap 'rm -f "$archive"' EXIT
          now_ns() {
            python3 -c 'import time; print(time.monotonic_ns())'
          }

          load_start_ns=$(now_ns)
          gzip -dc "$archive" | docker load >/dev/null
          load_end_ns=$(now_ns)

          run_start_ns=$(now_ns)
          output=$(docker run --rm --name "project4-smoke-$run_id" "$image")
          run_end_ns=$(now_ns)

          printf '%s\n' "$output"
          grep -Fq 'string: The quick brown fox jumps over the lazy dog' <<<"$output"
          grep -Fq 'reversed: god yzal eht revo spmuj xof nworb kciuq ehT' <<<"$output"

          echo "METRIC_REMOTE_LOAD_MS=$(((load_end_ns - load_start_ns) / 1000000))"
          echo "METRIC_REMOTE_RUN_MS=$(((run_end_ns - run_start_ns) / 1000000))"
          REMOTE
          )

          printf '%s\n' "$remote_output"
          remote_load_ms=$(awk -F= '/^METRIC_REMOTE_LOAD_MS=/{print $2}' <<<"$remote_output")
          remote_run_ms=$(awk -F= '/^METRIC_REMOTE_RUN_MS=/{print $2}' <<<"$remote_output")
          test -n "$remote_load_ms"
          test -n "$remote_run_ms"
          echo "REMOTE_LOAD_MS=$remote_load_ms" >> "$GITHUB_ENV"
          echo "REMOTE_RUN_MS=$remote_run_ms" >> "$GITHUB_ENV"

      - name: Record layer-ordering summary
        if: always()
        run: |
          total_ms=$(($(date +%s%3N) - PIPELINE_START_MS))
          echo "LAYER_ORDERING_METRICS dockerfile=$DOCKERFILE total_ms=$total_ms warmup_build_ms=${WARMUP_BUILD_MS:-NA} source_rebuild_ms=${SOURCE_REBUILD_MS:-NA} cached_steps=${CACHED_STEPS:-NA} restore_reran=${RESTORE_RERAN:-NA} image_bytes=${IMAGE_BYTES:-NA} archive_ms=${ARCHIVE_MS:-NA} archive_bytes=${ARCHIVE_BYTES:-NA} transfer_ms=${TRANSFER_MS:-NA} remote_load_ms=${REMOTE_LOAD_MS:-NA} remote_run_ms=${REMOTE_RUN_MS:-NA}"
          {
            echo "## Project 4 - Docker layer ordering"
            echo
            echo "| Metric | Result |"
            echo "|---|---:|"
            echo "| Dockerfile | $DOCKERFILE |"
            echo "| Total experiment | ${total_ms} ms |"
            echo "| Cache-populating build | ${WARMUP_BUILD_MS:-not completed} ms |"
            echo "| Source-change rebuild | ${SOURCE_REBUILD_MS:-not completed} ms |"
            echo "| Cached steps | ${CACHED_STEPS:-not measured} |"
            echo "| Restore reran | ${RESTORE_RERAN:-not measured} |"
            echo "| Image size | ${IMAGE_BYTES:-not measured} bytes |"
            echo "| Archive size | ${ARCHIVE_BYTES:-not measured} bytes |"
            echo "| Transfer to EC2 | ${TRANSFER_MS:-not run} ms |"
            echo "| EC2 image load | ${REMOTE_LOAD_MS:-not run} ms |"
            echo "| EC2 smoke test | ${REMOTE_RUN_MS:-not run} ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
